<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carte des mondes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Carte à gauche (îles flottantes), fiche « Voyager vers … » à droite. Un seul thème sombre, choisi exprès. */
:root{
  --nuit:#1b1428;      /* fond de la carte, même violet que le fond de l'image */
  --panneau:#23242b;
  --encart:#1a1b21;
  --trait:#2c2d35;
  --texte:#eae6f2;
  --doux:#9c9aa6;
  --cyan:#16c6e8;
  --or:#ffd27a;
  --f:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--nuit);color:var(--texte);font-family:var(--f)}
.page{position:relative;min-height:100%;overflow-x:hidden}

/* ---------- Carte ---------- */
.carte{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding-block:84px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 30% 40%,#251a38 0%,var(--nuit) 60%)}
.carte header{position:absolute;top:26px;left:max(28px,env(safe-area-inset-left,0px));z-index:6;display:flex;flex-direction:column;gap:4px;transition:opacity .5s}
.page.ouvert .carte header{opacity:0}
.carte header p{margin:0;font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#9a8fb3}
.carte h1{margin:0;font-size:30px;font-weight:800;color:#fff;text-wrap:balance}
.etoile{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:etoile 4s ease-in-out infinite;pointer-events:none}
@keyframes etoile{0%,100%{opacity:.15}50%{opacity:.85}}

.scene{position:relative;width:100%;max-width:1400px;margin:0 auto;aspect-ratio:2/1}
/* place des îles : côte à côte sur ordinateur, l'une sous l'autre sur téléphone */
#ile-0{left:6%;top:11%;width:37%}
#ile-2{left:55%;top:28%;width:38%}
@media (max-width:760px){
  .scene{aspect-ratio:3/4.2}
  #ile-0{left:2%;top:0;width:68%}
  #ile-2{left:26%;top:58%;width:72%}
  .scene .retour{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
}
#particules{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* ---------- Zoom au clic : tout le monde bouge, la scène reste ---------- */
.monde{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.3s cubic-bezier(.65,0,.25,1),opacity 1.4s ease,filter 1.4s ease}
.monde.long{transition:transform 2.6s cubic-bezier(.55,0,.12,1),opacity 1.4s ease,filter 1.4s ease}
/* pendant la vidéo des jeux, la carte disparaît complètement : plus de double image */
.scene.video-jeux .monde{opacity:0;filter:blur(8px)}
.scene.zoom .ile:not(.sel){opacity:.18;filter:blur(2px)}
.ile{transition:opacity .8s,filter .8s}
.scene.zoom .ile.sel .nom{opacity:0}
.retour{position:absolute;left:12px;top:12px;z-index:8;display:flex;align-items:center;gap:8px;padding:9px 14px;border:0;border-radius:99px;
  background:rgba(10,6,16,.72);color:#fff;font:600 14px var(--f);cursor:pointer;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .4s,transform .4s,background .2s;backdrop-filter:blur(6px)}
.retour:hover{background:rgba(30,20,46,.9)}
.retour:focus-visible{outline:2px solid #8ff0ff;outline-offset:2px}
.scene.zoom .retour{opacity:1;transform:none;pointer-events:auto}
/* plan rapproché vidéo de l'île des jeux, par-dessus la carte zoomée */
.plan{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;filter:blur(10px);transition:opacity 1.4s ease,filter 1.4s ease;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
.plan video{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 3s cubic-bezier(.2,.7,.2,1)}
.plan.on{opacity:1;filter:none}
.plan.on video{transform:scale(1)}
.plan.sort{transition-duration:.9s}

/* ---------- Île des jeux : lumières posées sur l'image fixe ---------- */
.jeux .cadre{aspect-ratio:4/3;-webkit-mask-image:radial-gradient(ellipse 56% 56% at 50% 48%,#000 76%,transparent 100%);mask-image:radial-gradient(ellipse 56% 56% at 50% 48%,#000 76%,transparent 100%)}
.jeux:hover .cadre,.jeux.sel .cadre{transform:scale(1.015);filter:brightness(1.05) saturate(1.08)}
.scene.video-jeux .jeux .amb{opacity:0}
.feu{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,170,60,.95),rgba(255,90,20,.4) 50%,transparent);animation:feu .9s ease-in-out infinite alternate}
@keyframes feu{0%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}35%{opacity:.95}60%{opacity:.7;transform:translate(-50%,-52%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.braise{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffcf70;box-shadow:0 0 5px 2px rgba(255,140,40,.8);opacity:0;animation:braise var(--t,2.2s) ease-out infinite;animation-delay:var(--dl)}
@keyframes braise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,4px),-60px);opacity:0}}
.fumee{position:absolute;width:5%;height:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(170,150,190,.45),transparent);filter:blur(4px);opacity:0;animation:fumee 5s ease-out infinite;animation-delay:var(--dl)}
@keyframes fumee{0%{transform:translate(-50%,0) scale(.5);opacity:0}25%{opacity:.6}100%{transform:translate(-20%,-140%) scale(2.2);opacity:0}}
.lune{position:absolute;left:27.5%;top:12.5%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,220,170,0) 58%,rgba(255,210,150,.45) 66%,transparent);animation:lune 6s ease-in-out infinite}
@keyframes lune{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.bombe{position:absolute;width:1.3%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#ff3030;box-shadow:0 0 8px 3px rgba(255,40,40,.85);animation:tictac 1s steps(1) infinite;animation-delay:var(--dl)}
@keyframes tictac{0%{opacity:1}50%{opacity:.1}}
.chute.violette{background:repeating-linear-gradient(180deg,rgba(190,110,255,0) 0 10px,rgba(215,160,255,.6) 14px,rgba(190,110,255,0) 22px);background-size:100% 44px}
.orbe{position:absolute;width:var(--s);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(200,150,255,.85),transparent);animation:orbe var(--t,6s) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes orbe{0%{transform:translate(-50%,-50%);opacity:.5}100%{transform:translate(-50%,calc(-50% - 14px));opacity:1}}
.reflet{position:absolute;width:var(--w,4%);height:var(--h,5%);overflow:hidden;mix-blend-mode:screen;border-radius:4px}
.reflet::after{content:"";position:absolute;top:-30%;bottom:-30%;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:reflet var(--t,5s) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes reflet{0%{left:-60%}30%,100%{left:120%}}
.bulle{position:absolute;left:65%;top:28.5%;width:3.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent);mix-blend-mode:screen;animation:bulle 3s ease-in-out infinite}
@keyframes bulle{0%,70%,100%{opacity:0}80%{opacity:1}}

/* brume qui dérive devant et derrière les îles */
.brume{position:absolute;pointer-events:none;border-radius:50%;filter:blur(28px);mix-blend-mode:screen;opacity:.0;animation:derive var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
.brume{background:radial-gradient(closest-side,rgba(150,110,210,.55),rgba(150,110,210,0))}
@keyframes derive{0%{transform:translateX(-6%) scale(1);opacity:.25}50%{opacity:.5}100%{transform:translateX(8%) scale(1.15);opacity:.3}}

/* ---------- Îles ---------- */
.ile{position:absolute;padding:0;border:0;background:none;cursor:pointer;display:block;pointer-events:none;color:inherit;font:inherit}
.ile:focus-visible{outline:none}
.ile:focus-visible .nom{opacity:1}
.ile .hit{position:absolute;inset:0;pointer-events:auto}
.flot{position:relative;display:block;animation:flotte var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ile img.ile-img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 76%,transparent 100%);mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 76%,transparent 100%);transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s;filter:brightness(.9) saturate(.95)}
.ile:hover img.ile-img,.ile.sel img.ile-img,.ile:focus-visible img.ile-img{transform:scale(1.02);filter:drop-shadow(0 0 30px var(--glow)) brightness(1.08) saturate(1.12)}
.halo{position:absolute;left:12%;right:12%;top:30%;bottom:8%;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);opacity:.22;filter:blur(30px);transition:opacity .5s;pointer-events:none}
.ile:hover .halo,.ile.sel .halo{opacity:.55}
.nom{position:absolute;left:50%;top:100%;transform:translate(-50%,-4px);white-space:nowrap;font:700 15px var(--f);color:#fff;background:rgba(10,6,16,.8);padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:5}
.ile:hover .nom{opacity:1;transform:translate(-50%,-14px)}
.badge{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:12px;z-index:5;transition:transform .4s;pointer-events:none}
.badge img{width:100%;height:100%;border-radius:12px;display:block;box-shadow:0 0 0 2px rgba(255,210,122,.75),0 0 24px rgba(255,170,70,.7)}
.badge i{position:absolute;inset:0;border-radius:12px;border:2px solid var(--or);animation:onde 2.4s ease-out infinite}
.badge i+i{animation-delay:-1.2s}
.ile:hover .badge,.ile.sel .badge{transform:translate(-50%,-62%) scale(1.08)}
@keyframes onde{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}

/* ---------- Île cinéma : image fixe + vidéo au survol ---------- */
.cadre{position:relative;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .6s;filter:brightness(.95)}
.cine .cadre{aspect-ratio:1/1;
  -webkit-mask-image:radial-gradient(ellipse 54% 54% at 50% 50%,#000 78%,transparent 100%);
          mask-image:radial-gradient(ellipse 54% 54% at 50% 50%,#000 78%,transparent 100%);
  transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .6s;filter:brightness(.95)}
.cine:hover .cadre,.cine.sel .cadre{transform:scale(1.015);filter:brightness(1.05) saturate(1.08)}
.cadre img,.cadre video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.cadre video{opacity:0;transition:opacity .7s ease}
.cine.live .cadre video{opacity:1;transition-duration:.55s}
.amb{position:absolute;inset:0;pointer-events:none;transition:opacity .6s ease}
.cine.live .amb{opacity:0}
.cadre .amb{z-index:1}

/* lumières posées sur l'image fixe */
.lueur{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--c),transparent);mix-blend-mode:screen;animation:vacille var(--t,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes vacille{0%,100%{opacity:.35}30%{opacity:.85}45%{opacity:.6}70%{opacity:1}}
.fenetre{animation-name:fenetre}
@keyframes fenetre{0%,100%{opacity:.15}8%{opacity:.8}60%{opacity:.7}66%{opacity:.1}}
.enseigne{position:absolute;left:47.4%;top:37.6%;width:19.8%;height:7.6%;overflow:hidden;mix-blend-mode:screen;border-radius:3px}
.enseigne::after{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-40%;
  background:linear-gradient(100deg,transparent,rgba(255,236,190,.55),transparent);animation:balaye-enseigne 4.5s ease-in-out infinite}
@keyframes balaye-enseigne{0%{left:-40%}55%,100%{left:110%}}
.cone{position:absolute;left:45.3%;top:21.6%;width:16%;height:9%;transform-origin:0 50%;transform:rotate(-27deg);
  background:linear-gradient(90deg,rgba(255,226,150,.65),rgba(255,226,150,0));clip-path:polygon(0 42%,100% 0,100% 100%,0 58%);
  mix-blend-mode:screen;filter:blur(2px);animation:clignote 2.2s steps(1) infinite,respire 3s ease-in-out infinite}
@keyframes clignote{0%{opacity:.75}12%{opacity:.6}20%{opacity:.8}47%{opacity:.65}60%{opacity:.85}83%{opacity:.7}}
@keyframes respire{0%,100%{filter:blur(2px)}50%{filter:blur(4px)}}
.phare{position:absolute;width:3.2%;height:42%;transform-origin:50% 100%;
  background:linear-gradient(0deg,rgba(225,215,255,.28),rgba(225,215,255,0));filter:blur(5px);mix-blend-mode:screen;
  animation:phare var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes phare{0%{transform:translate(-50%,-100%) rotate(calc(var(--r) - 9deg))}100%{transform:translate(-50%,-100%) rotate(calc(var(--r) + 9deg))}}
.chute{position:absolute;width:var(--w);height:var(--h);transform:translateX(-50%);mix-blend-mode:screen;opacity:.75;
  background:repeating-linear-gradient(180deg,rgba(255,200,110,0) 0 10px,rgba(255,214,140,.55) 14px,rgba(255,200,110,0) 22px);
  background-size:100% 44px;animation:coule 1.1s linear infinite;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 20%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 20%,#000 70%,transparent)}
@keyframes coule{to{background-position:0 44px}}
.goutte{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd590;box-shadow:0 0 6px 2px rgba(255,180,80,.7);opacity:0;animation:goutte var(--t,2.4s) ease-in infinite;animation-delay:var(--dl)}
@keyframes goutte{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,0),70px);opacity:0}}

/* ---------- Fiche « Voyager vers … » ---------- */
.fiche{position:fixed;top:0;right:0;bottom:0;z-index:20;width:min(440px,100%);overflow-y:auto;background:var(--panneau);display:flex;flex-direction:column;
  box-shadow:-20px 0 60px rgba(0,0,0,.45);transform:translateX(105%);visibility:hidden;transition:transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s .7s}
.page.ouvert .fiche{transform:none;visibility:visible;transition:transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s}
.fermer{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border:0;border-radius:50%;background:rgba(10,6,16,.7);color:#fff;font:600 20px/1 var(--f);cursor:pointer}
.fermer:hover{background:rgba(30,20,46,.95)}
.fermer:focus-visible{outline:2px solid #8ff0ff;outline-offset:2px}
@media (max-width:760px){
  .fiche{top:auto;width:100%;max-height:60vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
}
.ban{position:relative;overflow:hidden;aspect-ratio:2/1;max-width:100%}
.ban img{width:100%;height:100%;object-fit:cover;display:block;animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,1%)}}
.ban::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(0deg,var(--panneau),transparent)}
.corps{padding:26px 28px 30px;display:flex;flex-direction:column;gap:18px;flex-grow:1}
.tete{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tete img{width:44px;height:44px;border-radius:10px}
.tete h2{margin:0;font-size:28px;font-weight:800;color:#fff}
.etat{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px}
.etat.on{background:rgba(60,200,120,.18);color:#5ee39a}
.etat.off{background:rgba(255,255,255,.08);color:#b0aebb}
.desc{margin:0;font-size:15px;line-height:1.6;color:#c4c2cc;max-width:62ch}
.lignes{background:var(--encart);border-radius:8px;padding:6px 18px;display:flex;flex-direction:column}
.lignes div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--trait);font-size:15px}
.lignes div:last-child{border-bottom:0}
.lignes span:first-child{color:var(--doux)}
.lignes span:last-child{font-weight:700;color:#fff;text-align:right}
.clins{display:flex;flex-direction:column;gap:8px}
.clins>span{font-size:13px;color:var(--doux)}
.clins div{display:flex;flex-wrap:wrap;gap:6px}
.clins div span{font-size:13px;padding:5px 10px;border-radius:6px;background:#2e2f38;color:#e4e2ea}
.prix{display:flex;justify-content:space-between;font-size:15px}
.prix span:first-child{color:var(--doux)}
.prix span:last-child{font-weight:700}
.voyage{display:block;text-align:center;padding:16px;border-radius:8px;background:var(--cyan);color:#062a33;font:700 17px var(--f);text-decoration:none;transition:filter .2s,transform .2s}
.voyage:hover{filter:brightness(1.1);transform:translateY(-1px)}
.voyage:focus-visible{outline:3px solid #8ff0ff;outline-offset:3px}
.ferme{display:block;text-align:center;padding:16px;border-radius:8px;background:#34353f;color:var(--doux);font-weight:700;font-size:17px}
.fiche .contenu{transition:opacity .25s}
.fiche.change .contenu{opacity:0}

/* ---------- Double-clic : on fonce dans l'île, le rideau se ferme, le site s'ouvre ---------- */
.monde.fonce{transition:transform 1.8s cubic-bezier(.55,0,.85,.3)!important}
/* lumière chaude de l'entrée qui envahit l'écran pendant qu'on fonce */
.entree{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity 1.1s cubic-bezier(.6,0,.9,.4);
  background:radial-gradient(circle at 50% 50%,rgba(255,214,150,.9) 0,rgba(214,120,60,.75) 25%,rgba(80,20,30,.95) 70%)}
.carte.fonce .entree{opacity:1;transition-delay:.45s}
.rideau{position:fixed;inset:0;z-index:50;pointer-events:none;display:grid;place-items:center}
.rideau .pan{position:absolute;top:0;bottom:0;width:51%;transition:transform 1.15s cubic-bezier(.6,0,.2,1);
  background:repeating-linear-gradient(90deg,#5e0a12 0,#8c1420 3.5%,#b3212f 6%,#8c1420 8.5%,#5e0a12 12%),#7d111c;
  box-shadow:inset 0 -60px 80px rgba(0,0,0,.45),inset 0 40px 60px rgba(0,0,0,.35)}
.rideau .pan.g{left:0;transform:translateX(-102%);transform-origin:left}
.rideau .pan.d{right:0;transform:translateX(102%);transform-origin:right}
.rideau .pan::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7%;background:linear-gradient(0deg,#c8952f,#e8c56a 40%,#9a6a1c)}
.rideau.ferme .pan{transform:none}
.rideau .mot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transform:scale(.9);transition:opacity .6s .9s,transform .9s .9s cubic-bezier(.2,.8,.2,1);text-align:center;padding-inline:16px}
.rideau.ferme .mot{opacity:1;transform:none}
.rideau .mot img{width:96px;height:96px;border-radius:22px;box-shadow:0 0 0 3px rgba(255,210,122,.8),0 0 40px rgba(255,180,80,.7)}
.rideau .mot b{font:800 28px var(--f);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.rideau .mot span{font:500 15px var(--f);color:#ffe7c2}
.rideau .apercu{display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:auto}
.rideau .apercu a,.rideau .apercu button{font:700 15px var(--f);padding:12px 18px;border-radius:8px;border:0;cursor:pointer;text-decoration:none}
.rideau .apercu a{background:var(--cyan);color:#062a33}
.rideau .apercu button{background:rgba(0,0,0,.45);color:#fff}
.bulle-info{position:absolute;left:50%;bottom:14px;z-index:9;transform:translate(-50%,10px);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;
  background:rgba(10,6,16,.85);color:#fff;font:600 14px var(--f);padding:10px 16px;border-radius:99px;white-space:nowrap}
.bulle-info.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .carte h1{font-size:24px}
  .badge{width:34px;height:34px}
  .nom{font-size:13px}
}
</style>
</head>
<body style="margin:0">

<div class="page">
<section class="carte" id="carte" aria-label="Carte des mondes">
  <div class="entree"></div>
  <header>
    <p>jellyker.fr</p>
    <h1>Choisis ta destination</h1>
  </header>

  <div class="scene" id="scene">

<script>
(() => {
  const FICHES = [
    { nom: 'L’Entracte', ban: 'media/banniere-entracte.webp', alt: 'Le cinéma de l’île L’Entracte : enseigne lumineuse, rideau rouge et projecteur à bobines sur le toit',
      logo: 'media/logo-entracte.webp', ouvert: true, href: 'https://jellyfin.jellyker.fr/',
      desc: 'L’île du cinéma. Le projecteur tourne sur le toit, l’enseigne s’allume, les réverbères brillent et des cascades de lumière tombent dans le vide. Tous les films et séries de la famille, les séances communes de L’Entracte, et Gwendal+ pour la télé et le téléphone.',
      lignes: [['Contenu', 'Films, séries, anime'], ['Séances communes', 'Ouvertes'], ['Accès', 'Famille et amis'], ['Ouverture', 'Jour et nuit']],
      clins: ['Projecteur à bobines', 'Pellicule lumineuse', 'Rideau rouge', 'Guichet à tickets', 'Affiches de film noir', 'Voiture des années 30', 'Big Ben', 'Projecteurs de première'] },
    { nom: 'Album photo', ban: 'media/banniere-album.webp', alt: 'Le studio photo de l’île Album : appareil géant, projecteurs et famille qui pose', ouvert: false,
      desc: 'L’île de la photo. Un appareil géant, deux projecteurs de studio, un photographe qui mitraille la famille devant le fond blanc et les tirages qui sèchent sous les cerisiers. Toutes les photos de famille, rangées par événement.',
      lignes: [['Contenu', 'Photos et vidéos'], ['Rangement', 'Par événement'], ['Accès', 'Famille'], ['Ouverture', 'En construction']], clins: [] },
    { nom: 'Mini-jeux', ban: 'media/banniere-jeux.webp', alt: 'L’île Mini-jeux : feu de camp du loup-garou, bombe à désamorcer et tableau des suspects', ouvert: false,
      desc: 'L’île des jeux d’enquête. Le loup hurle sous la pleine lune près du feu de camp, le tableau relie les suspects, une bombe attend d’être désamorcée et le gros dé roule pour la partie suivante. Loup-garou, enquêtes et jeux d’équipe, avec le téléphone comme manette.',
      lignes: [['Contenu', 'Loup-garou, enquêtes, quiz'], ['Joueurs', 'De 2 à 12'], ['Accès', 'Famille et amis'], ['Ouverture', 'En construction']],
      clins: ['Loup sous la pleine lune', 'Feu de camp', 'Cartes des rôles', 'Tableau des suspects', 'Chapeau du détective', 'Loupe', 'Bombe à désamorcer', 'Gros dé rouge'] }
  ];
  const $ = (id) => document.getElementById(id);
  const fiche = $('fiche');
  let sel = -1;
  const page = document.querySelector('.page');

  function remplir(f) {
    $('f-ban').src = f.ban; $('f-ban').alt = f.alt;
    $('f-logo').hidden = !f.logo; if (f.logo) $('f-logo').src = f.logo;
    $('f-nom').textContent = f.nom;
    const e = $('f-etat'); e.textContent = f.ouvert ? 'En ligne' : 'Bientôt'; e.className = 'etat ' + (f.ouvert ? 'on' : 'off');
    $('f-desc').textContent = f.desc;
    $('f-lignes').replaceChildren(...f.lignes.map(([k, v]) => {
      const d = document.createElement('div'), a = document.createElement('span'), b = document.createElement('span');
      a.textContent = k; b.textContent = v; d.append(a, b); return d;
    }));
    const c = $('f-clins'); c.hidden = !f.clins.length;
    c.querySelector('div').replaceChildren(...f.clins.map((t) => { const s = document.createElement('span'); s.textContent = t; return s; }));
    $('f-go').hidden = !f.ouvert; $('f-ferme').hidden = f.ouvert;
    if (f.ouvert) { $('f-go').href = f.href; $('f-go').textContent = 'Voyager vers ' + f.nom; }
  }
  function choisir(i) {
    if (i === zoomI) return;
    if (i !== sel) {
      const dejaOuvert = page.classList.contains('ouvert');
      sel = i;
      document.querySelectorAll('.ile').forEach((b) => b.classList.toggle('sel', +b.dataset.i === i));
      if (dejaOuvert) {
        fiche.classList.add('change');
        setTimeout(() => { remplir(FICHES[i]); fiche.classList.remove('change'); }, 250);
      } else remplir(FICHES[i]);
    }
    // la fiche n'apparaît qu'au clic sur une île
    page.classList.add('ouvert');
    fiche.scrollTop = 0;
    mesurerPan();
    zoomer(i);
  }
  document.querySelectorAll('.ile').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); choisir(+b.dataset.i); }));

  /* ----- Zoom : on calcule où est l'île dans la scène et on rapproche tout le monde ----- */
  const scene = $('scene'), monde = $('monde'), plan = $('plan'), vidJeux = $('vid-jeux');
  let zoomI = -1, fonduTimer = 0, planTimer = 0, sortieTimer = 0;
  // zone de la scène encore visible à côté de la fiche (à droite sur ordinateur, en bas sur téléphone), en coordonnées de la scène
  let vis = null;
  function mesurerPan() {
    const r = scene.getBoundingClientRect(), large = window.innerWidth > 760;
    const fw = Math.min(440, window.innerWidth), fh = fiche.offsetHeight;
    const L = Math.max(0, r.left), R = large ? Math.min(r.right, window.innerWidth - fw) : Math.min(r.right, window.innerWidth);
    const T = large ? Math.max(0, r.top) : 56, B = large ? Math.min(r.bottom, window.innerHeight) : window.innerHeight - fh;
    vis = { x: L - r.left, y: T - r.top, w: Math.max(80, R - L), h: Math.max(80, B - T) };
    Object.assign(plan.style, { left: vis.x + 'px', top: vis.y + 'px', width: vis.w + 'px', height: vis.h + 'px', right: 'auto', bottom: 'auto' });
  }
  function cible(i) {
    if (!vis) mesurerPan();
    const b = $('ile-' + i), W = vis.w, H = vis.h;
    const x = b.offsetLeft, y = b.offsetTop, w = b.offsetWidth, h = b.offsetHeight;
    // data-kw : part de la largeur de l'île qui remplit la scène (cadrage proche de la 1re image de la vidéo)
    const k = b.dataset.kw ? W / (+b.dataset.kw * w) : Math.min(W * 0.96 / w, H * 0.96 / h) * (+b.dataset.z || 1);
    const fx = b.dataset.fx ? +b.dataset.fx : 0.5, fy = b.dataset.fy ? +b.dataset.fy : 0.5;
    const tx = vis.x + W / 2 - (x + w * fx) * k, ty = vis.y + H / 2 - (y + h * fy) * k;
    return 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
  }
  function zoomer(i) {
    clearTimeout(fonduTimer); clearTimeout(planTimer); clearTimeout(sortieTimer);
    if (zoomI === 2 && i !== 2) cacherPlan();
    zoomI = i;
    scene.classList.add('zoom');
    monde.classList.toggle('long', i === 2);
    monde.style.transform = cible(i);
    majVideoCine();
    if (i === 2) {
      // la vidéo démarre tout de suite (cachée) pour être prête ; le fondu commence quand le zoom ralentit
      try { vidJeux.currentTime = 0; } catch (e) {}
      const p = vidJeux.play();
      let pret = false, temps = false;
      const montre = () => { if (zoomI !== 2 || !pret || !temps) return; plan.classList.remove('sort'); plan.classList.add('on'); scene.classList.add('video-jeux'); };
      const ok = () => { pret = true; montre(); };
      if (p && p.then) p.then(() => vidJeux.requestVideoFrameCallback ? vidJeux.requestVideoFrameCallback(ok) : ok()).catch(() => {}); else ok();
      fonduTimer = setTimeout(() => { temps = true; montre(); }, 1350);
    }
  }
  function cacherPlan() {
    plan.classList.add('sort'); plan.classList.remove('on'); scene.classList.remove('video-jeux');
    planTimer = setTimeout(() => { if (zoomI !== 2) vidJeux.pause(); }, 950);
  }
  function dezoomer() {
    if (zoomI < 0 || enRoute) return;
    clearTimeout(fonduTimer); clearTimeout(sortieTimer);
    const avait = zoomI;
    zoomI = -1;
    majVideoCine();
    page.classList.remove('ouvert');
    sel = -1;
    document.querySelectorAll('.ile').forEach((b) => b.classList.remove('sel'));
    const recule = () => { monde.classList.remove('long'); monde.style.transform = ''; scene.classList.remove('zoom'); };
    if (avait === 2) {
      const avecVideo = plan.classList.contains('on');
      cacherPlan();
      if (avecVideo) sortieTimer = setTimeout(() => { if (zoomI < 0) recule(); }, 700); else recule();
    } else recule();
  }
  $('retour').addEventListener('click', (e) => { e.stopPropagation(); dezoomer(); });
  $('fermer').addEventListener('click', () => dezoomer());
  scene.addEventListener('click', () => dezoomer());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') dezoomer(); });
  new ResizeObserver(() => { if (zoomI >= 0) { mesurerPan(); monde.style.transform = cible(zoomI); } }).observe(scene);

  /* ----- Vidéo au survol : la 1re image de la vidéo est identique à l'image fixe,
           donc le fondu enchaîné ne saute pas. La vidéo fait aller-retour, donc la boucle ne saute pas non plus. ----- */
  const ile = $('ile-0'), vid = $('vid');
  let survol = false, veut = false, stopTimer = 0;
  function montrer() {
    if (!veut) return;
    ile.classList.add('live');
  }
  function majVideoCine() {
    const doit = survol || zoomI === 0;
    if (doit && !veut) lancer(); else if (!doit && veut) arreter();
  }
  function entrer() { survol = true; majVideoCine(); }
  function sortir() { survol = false; majVideoCine(); }
  function lancer() {
    veut = true;
    clearTimeout(stopTimer);
    if (ile.classList.contains('live')) return;
    const p = vid.play();
    const pret = () => {
      if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(montrer);
      else montrer();
    };
    if (p && p.then) p.then(pret).catch(() => {}); else pret();
  }
  function arreter() {
    veut = false;
    ile.classList.remove('live');
    clearTimeout(stopTimer);
    stopTimer = setTimeout(() => { if (!veut) { vid.pause(); try { vid.currentTime = 0; } catch (e) {} } }, 750);
  }
  ile.addEventListener('pointerenter', entrer);
  ile.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') sortir(); });
  ile.addEventListener('focus', entrer);
  ile.addEventListener('blur', sortir);
  // Au doigt : un appui lance la vidéo, un appui ailleurs l'arrête.
  document.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch' && !ile.contains(e.target)) sortir(); });

  /* ----- Double-clic (ou bouton « Voyager vers ») : on fonce vers l'entrée de l'île,
           le rideau rouge se ferme, puis le site s'ouvre dans le même onglet. ----- */
  const rideau = $('rideau');
  let enRoute = false, bulleTimer = 0;
  const dansCadre = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  function bulle(t) {
    const b = $('bulle-info'); b.textContent = t; b.classList.add('on');
    clearTimeout(bulleTimer); bulleTimer = setTimeout(() => b.classList.remove('on'), 2600);
  }
  function voyager(i) {
    const f = FICHES[i];
    if (!f.ouvert) { bulle(f.nom + ' est encore en construction'); return; }
    if (enRoute) return;
    enRoute = true;
    if (zoomI !== i) choisir(i);
    if (!vis) mesurerPan();
    const b = $('ile-' + i), W = vis.w, H = vis.h;
    const px = +(b.dataset.px || 0.5), py = +(b.dataset.py || 0.5);
    const k = Math.min(W * 0.96 / b.offsetWidth, H * 0.96 / b.offsetHeight) * 4;
    const tx = vis.x + W / 2 - (b.offsetLeft + b.offsetWidth * px) * k, ty = vis.y + H / 2 - (b.offsetTop + b.offsetHeight * py) * k;
    monde.classList.add('fonce'); $('carte').classList.add('fonce');
    monde.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
    $('r-nom').textContent = f.nom; $('r-lien').href = f.href; $('r-lien').textContent = 'Ouvrir ' + f.nom;
    $('r-txt').textContent = 'Ouverture de la séance…'; $('r-apercu').hidden = true;
    setTimeout(() => { rideau.classList.add('ferme'); rideau.setAttribute('aria-hidden', 'false'); }, 900);
    setTimeout(() => {
      if (dansCadre) {
        // aperçu dans Claude : la page ne peut pas se remplacer elle-même, on propose le lien
        $('r-txt').textContent = 'Sur jellyker.fr, le site s’ouvre ici tout seul.';
        $('r-apercu').hidden = false;
      } else {
        location.assign(f.href);
      }
    }, 2500);
  }
  function revenir() {
    enRoute = false;
    rideau.classList.remove('ferme'); rideau.setAttribute('aria-hidden', 'true');
    monde.classList.remove('fonce'); $('carte').classList.remove('fonce');
    if (zoomI >= 0) monde.style.transform = cible(zoomI);
  }
  document.querySelectorAll('.ile').forEach((b) => b.addEventListener('dblclick', (e) => { e.preventDefault(); e.stopPropagation(); voyager(+b.dataset.i); }));
  $('f-go').addEventListener('click', (e) => { e.preventDefault(); voyager(sel); });
  $('r-retour').addEventListener('click', revenir);
  // retour arrière du navigateur : la page revient ouverte, pas fermée par le rideau
  window.addEventListener('pageshow', (e) => { if (e.persisted) revenir(); });

  /* ----- Étoiles ----- */
  const carte = document.querySelector('.carte');
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span'); s.className = 'etoile';
    s.style.left = ((k * 37) % 100) + '%'; s.style.top = ((k * 53) % 100) + '%';
    s.style.animationDelay = (-(k % 7) * 0.6) + 's'; s.style.animationDuration = (3 + (k % 5)) + 's';
    carte.prepend(s);
  }

  /* ----- Particules : poussières dorées qui montent de l'île cinéma, lucioles sur les autres ----- */
  const cv = $('particules'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function taille() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = scene.clientWidth; H = scene.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(taille).observe(scene); taille();
  // zones en fraction de la scène : [x, y, largeur, hauteur, couleur]
  // les poussières naissent au-dessus de chaque île (calculé depuis sa place réelle, ordinateur ou téléphone)
  const COUL = { 0: '255,214,140', 2: '200,140,255' };
  function zone(z) {
    const b = $('ile-' + z), Wt = scene.clientWidth || 1, Ht = scene.clientHeight || 1;
    return [(b.offsetLeft + b.offsetWidth * 0.15) / Wt, (b.offsetTop + b.offsetHeight * 0.18) / Ht, b.offsetWidth * 0.7 / Wt, b.offsetHeight * 0.5 / Ht, COUL[z]];
  }
  const parts = [];
  function nouvelle(z, debut) {
    const [x, y, w, h, c] = zone(z);
    return { z, c, x: x + Math.random() * w, y: y + h * (0.4 + Math.random() * 0.6), vy: 0.006 + Math.random() * 0.012,
      vx: (Math.random() - 0.5) * 0.004, r: 0.8 + Math.random() * 1.8, vie: debut ? Math.random() : 0, duree: 4 + Math.random() * 5, ph: Math.random() * 6.28 };
  }
  for (let k = 0; k < 34; k++) parts.push(nouvelle(0, true));
  for (let k = 0; k < 10; k++) parts.push(nouvelle(2, true));
  let avant = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - avant) / 1000); avant = t;
    ctx.clearRect(0, 0, W, H);
    const actif = ile.classList.contains('live');
    for (let k = 0; k < parts.length; k++) {
      let p = parts[k];
      p.vie += dt / p.duree;
      if (p.vie >= 1) { p = parts[k] = nouvelle(p.z, false); }
      p.y -= p.vy * dt * (actif && p.z === 0 ? 1.8 : 1);
      p.x += p.vx * dt + Math.sin(t / 900 + p.ph) * 0.00012;
      const a = Math.sin(p.vie * Math.PI) * (actif && p.z === 0 ? 1 : 0.75);
      const px = p.x * W, py = p.y * H, r = p.r * (W / 1000 + 0.5);
      const g = ctx.createRadialGradient(px, py, 0, px, py, r * 4);
      g.addColorStop(0, 'rgba(' + p.c + ',' + a + ')');
      g.addColorStop(1, 'rgba(' + p.c + ',0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * 4, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
