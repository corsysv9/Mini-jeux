name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: for f in $(find www -name '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - run: php tests/run.php
