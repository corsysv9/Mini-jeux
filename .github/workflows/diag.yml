name: Diagnostic hub
on:
  push:
    branches: [diag/hub]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for h in jeux minijeux mini-jeux games game jeu party soiree fun play arcade; do echo "$h: $(dig +short A $h.jellyker.fr @dns111.ovh.net | tr '\n' ' ')"; done
          dig +short AXFR jellyker.fr @dns111.ovh.net | head || true
