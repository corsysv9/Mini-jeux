name: Diagnostic hub
on:
  push:
    branches: [diag/hub]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Proxy
        run: |
          curl -sS -m 20 https://cluster129.hosting.ovh.net/ -H "Host: jellykb.cluster129.hosting.ovh.net" | grep -o "<title>[^<]*" || true
          curl -sS -m 20 https://cluster129.hosting.ovh.net/api/index.php -H "Host: jellykb.cluster129.hosting.ovh.net" -H 'Content-Type: application/json' -d '{"action":"state","code":"ZZZZZ"}' || true
