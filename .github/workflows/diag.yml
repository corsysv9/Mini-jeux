name: Diagnostic hub
on:
  push:
    branches: [diag/hub]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Hub
        run: |
          curl -sS -m 20 -D - -o /tmp/b https://jellyker.fr/ || true
          wc -c /tmp/b || true
          head -c 300 /tmp/b || true; grep -c jellykb /tmp/b || true
          echo; grep -n "nom: 'Mini-jeux'" /tmp/b | cut -c1-300 || true
          curl -sS -m 20 -o /dev/null -w "media %{http_code}\n" https://jellyker.fr/media/banniere-jeux.webp || true
