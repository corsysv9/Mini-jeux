name: Diagnostic hub
on:
  push:
    branches: [diag/hub]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Jeux
        run: |
          curl -sS -m 20 -o /tmp/b -w "page %{http_code}\n" https://jeux.jellyker.fr/ || true
          grep -o "<title>[^<]*" /tmp/b || true
          curl -sS -m 20 https://jeux.jellyker.fr/api/index.php -H 'Content-Type: application/json' -d '{"action":"create","name":"Verif"}' | head -c 200 || true
          echo
          curl -sS -m 20 -o /dev/null -w "app.js %{http_code}\n" https://jeux.jellyker.fr/assets/app.js?v=3 || true
          curl -sS -m 20 https://jellyker.fr/ | grep -o "ouvert: true, href: '[^']*'" || true
