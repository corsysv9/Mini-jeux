name: Diagnostic hub
on:
  push:
    branches: [diag/hub]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Jeux
        run: |
          curl -sS -m 20 -D - -o /tmp/b https://jeux.jellyker.fr/ | head -12 || true
          grep -o "<title>[^<]*" /tmp/b || true
          curl -sS -m 20 https://jeux.jellyker.fr/api/index.php -H 'Content-Type: application/json' -d '{"action":"state","code":"ZZZZZ"}' || true
          echo
          curl -sS -m 20 https://jellyker.fr/ | grep -o "ouvert: true, href: '[^']*'" || true
